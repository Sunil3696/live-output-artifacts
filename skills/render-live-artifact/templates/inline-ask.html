<!-- INLINE ASK widget — render an ir-mcp orchestrator's REQUEST FOR INPUT as an
     in-chat form (via the visualize `show_widget` tool), instead of walking the
     user through questions one at a time in plain text.

     WHEN: an ir-mcp orchestrator (rockstar, kane, head_of_*, mygentic_poc, …)
     comes back asking the user something — an interview ("Question 1 of N"),
     a clarification, or a set of choices.

     HOW TO USE (Claude):
       1. Enumerate ALL the orchestrator's questions in one go (see
          references/inline-widgets.md § Batch the interview).
       2. Copy this body into `show_widget` (widget_code). It is already
          show_widget-ready — no <html>/<head>/<body> wrapper.
       3. Fill every {{...}} token. Repeat the .ia-block per question. Pre-fill
          each field's value with your best draft from context when you have one
          (the user edits instead of composing from blank); leave empty otherwise.
       4. On submit the widget sends the user's answers VERBATIM — one per line, in
          question order, exactly as typed, with no prefix or rewriting. You then map
          them to the questions you asked and thread them back to the SAME orchestrator
          session in a single tool call (references/inline-widgets.md § Pass it
          straight through).

     THEME + HOST NOTE: fixed MyGentic light/paper palette (matches the command
     centre). The visualize host FORCE-STYLES real form controls to its own theme,
     so action buttons are styled <div>s (not <button>) and the real <textarea>s are
     forced back with !important. NEVER use host CSS variables (--surface-*,
     --text-*) — they follow the host dark mode and go invisible on a light card. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap');
.mg-ask{--paper:#fff;--base:#f4f7fb;--raised:#eef2f8;--bd:rgba(11,14,46,.10);--ink:#0b0e2e;--ink2:#242b5c;--muted:#4a5578;--faint:#8a93b0;--accent:#3A4FB8;--violet:#8B7AE8;--f-disp:"Instrument Serif",Georgia,serif;--f-body:"Inter",-apple-system,system-ui,sans-serif;--f-lbl:"Plus Jakarta Sans","Inter",sans-serif;background:var(--paper);border:1px solid var(--bd);border-radius:17px;padding:18px 20px;box-shadow:0 8px 24px rgba(11,14,46,.06);font-family:var(--f-body);color:var(--ink)}
.mg-ask *{box-sizing:border-box}
.mg-ttl{font-family:var(--f-disp);font-size:19px;font-weight:400;color:var(--ink);line-height:1.1}
.mg-ttl b{color:var(--accent);font-weight:400}
.mg-qlabel{font:500 13px var(--f-lbl);color:var(--ink2);display:block;margin-bottom:5px}
/* real textarea — force past the host's pre-styling */
.mg-ask textarea.ia-field{width:100%;font:400 13px var(--f-body)!important;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;background:var(--base)!important;border:1px solid var(--bd)!important;border-radius:9px!important;padding:9px 11px!important;resize:vertical}
.mg-ask textarea.ia-field::placeholder{color:var(--faint)!important;-webkit-text-fill-color:var(--faint)!important;opacity:1}
.mg-ask textarea.ia-field:focus{outline:none!important;border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(58,79,184,.12)!important}
/* action controls are DIVs so the host cannot re-theme them */
.mg-act{font:500 13px var(--f-lbl);padding:9px 13px;border-radius:9px;border:1px solid var(--bd);background:var(--paper);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;user-select:none}
.mg-act:hover{color:var(--ink);border-color:rgba(11,14,46,.18)}
.mg-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.mg-primary:hover{background:#334499;color:#fff;border-color:#334499}
.mg-primary.is-off{opacity:.45;cursor:not-allowed}
</style>
<div class="mg-ask">
  <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
    <i class="ti ti-messages" aria-hidden="true" style="font-size:18px;color:var(--accent)"></i>
    <span class="mg-ttl"><b>{{ORCH_NAME}}</b></span>
    <span style="font:500 11px var(--f-lbl);color:var(--faint);margin-left:auto"><span id="ia-count">0</span>/{{N}} answered</span>
  </div>
  <div style="height:6px;background:var(--raised);border-radius:4px;overflow:hidden;margin-bottom:16px">
    <div id="ia-bar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--violet));transition:width .2s"></div>
  </div>

  <!-- ── repeat one .ia-block per question ── -->
  <div class="ia-block" style="margin-bottom:12px">
    <label class="mg-qlabel">1. {{QUESTION_1}}</label>
    <textarea class="ia-field ia-q" data-q="1" rows="2" placeholder="Your answer…">{{DRAFT_1}}</textarea>
  </div>
  <div class="ia-block" style="margin-bottom:12px">
    <label class="mg-qlabel">2. {{QUESTION_2}}</label>
    <textarea class="ia-field ia-q" data-q="2" rows="2" placeholder="Your answer…">{{DRAFT_2}}</textarea>
  </div>
  <!-- ── end repeat ── -->

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px">
    <div id="ia-send" class="mg-act mg-primary is-off" role="button" tabindex="0" style="flex:1;min-width:200px">Send answers <i class="ti ti-send" aria-hidden="true"></i></div>
  </div>
  <div style="border-top:1px solid var(--bd);padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span style="font:400 11px var(--f-body);color:var(--faint);flex:1">Editing is free — only Send costs a message</span>
    <div class="mg-act" role="button" tabindex="0" onclick="sendPrompt('Skip')"><i class="ti ti-player-skip-forward" aria-hidden="true" style="font-size:15px"></i> Skip</div>
    <div class="mg-act" role="button" tabindex="0" onclick="sendPrompt('Cancel')"><i class="ti ti-x" aria-hidden="true" style="font-size:15px"></i> Cancel</div>
  </div>
</div>
<script>
(function(){
  var qs=[].slice.call(document.querySelectorAll('.ia-q')), N=qs.length, send=document.getElementById('ia-send');
  function ready(){ return qs.filter(function(q){return (q.value||'').trim();}).length===N; }
  function upd(){
    var f=qs.filter(function(q){return (q.value||'').trim();}).length;
    document.getElementById('ia-count').textContent=f;
    document.getElementById('ia-bar').style.width=Math.round(f/N*100)+'%';
    send.classList.toggle('is-off', f!==N);
  }
  function submit(){
    if(!ready()) return;
    // send the answers exactly as typed — one per line, in question order, no rewriting
    var parts=qs.sort(function(a,b){return +a.dataset.q-+b.dataset.q;})
      .map(function(q){return (q.value||'').trim().replace(/\s+/g,' ');});
    sendPrompt(parts.join('\n'));
  }
  qs.forEach(function(q){q.addEventListener('input',upd);}); upd();
  send.addEventListener('click',submit);
  send.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); submit(); } });
  [].slice.call(document.querySelectorAll('.mg-act[onclick]')).forEach(function(el){
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } });
  });
})();
</script>
